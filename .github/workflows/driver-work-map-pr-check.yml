name: Verificar Trabajo Mapa TUKTUK
on:
  pull_request:
    paths:
      - 'flutter_app/lib/presentation/marketplace_jobs.dart'
      - 'flutter_app/test/presentation/marketplace_work_map_premium_test.dart'
      - '.github/workflows/driver-work-map-pr-check.yml'
permissions:
  contents: read
jobs:
  flutter-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Checkout exact pull request
        uses: actions/checkout@v4
      - name: Setup Flutter 3.44.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      - name: Dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Test
        run: flutter test --no-pub