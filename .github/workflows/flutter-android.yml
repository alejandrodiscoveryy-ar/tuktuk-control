name: Build signed Android release

on:
  push:
    branches: [main]
    paths:
      - 'flutter_app/tool/android_release_request.txt'
  workflow_dispatch:
    inputs:
      expected_version_code:
        description: "versionCode que ya debe estar definido en pubspec.yaml"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: signed-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-android:
    if: ${{ github.ref == 'refs/heads/main' }}
    name: Validate, test and build signed AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: flutter_app

    steps:
      - name: Require successful web production deployment of exact main commit
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            CURRENT_MAIN="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
            test "$CURRENT_MAIN" = "$GITHUB_SHA"
            STATUS="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-web-production.yml/runs" -f head_sha="$GITHUB_SHA" -f branch=main --jq '.workflow_runs | sort_by(.created_at) | last | if . == null then "pending" elif .status == "completed" then .conclusion else "pending" end')"
            if [ "$STATUS" = success ]; then
              echo "PRODUCTION_VERIFIED_FOR=$GITHUB_SHA"
              exit 0
            fi
            if [ "$STATUS" != pending ]; then
              echo "Production deployment did not succeed: $STATUS"
              exit 1
            fi
            sleep 10
          done
          echo "No successful production deployment for this commit within verification window."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Sync Android project branding
        env:
          TUKTUK_REQUIRE_FRESH_BRANDING: "1"
        run: dart run tool/sync_project_branding.dart --android

      - name: Validate release metadata
        id: metadata
        shell: bash
        env:
          EXPECTED_VERSION_CODE: ${{ inputs.expected_version_code }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version: //p' pubspec.yaml)"
          VERSION_NAME="${VERSION%%+*}"
          VERSION_CODE="${VERSION##*+}"
          FLUTTER_ROOT="$(cd "$(dirname "$(command -v flutter)")/.." && pwd)"
          FLUTTER_ANDROID_DEFAULTS="$FLUTTER_ROOT/packages/flutter_tools/gradle/src/main/kotlin/FlutterExtension.kt"

          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            EXPECTED_VERSION_CODE="$(head -n 1 tool/android_release_request.txt)"
          fi
          [[ "$EXPECTED_VERSION_CODE" =~ ^[0-9]+$ ]]
          test "$VERSION_CODE" = "$EXPECTED_VERSION_CODE"
          grep -Fq 'android:label="@string/app_name"' android/app/src/main/AndroidManifest.xml
          grep -Fq '<string name="app_name">TukTuk Conductor</string>' android/app/src/main/res/values/strings.xml
          grep -Fq 'applicationId = "com.alejandrocruz.tuktukcontrol"' android/app/build.gradle.kts
          grep -Eq 'compileSdkVersion: Int = 36' "$FLUTTER_ANDROID_DEFAULTS"
          grep -Eq 'targetSdkVersion: Int = 36' "$FLUTTER_ANDROID_DEFAULTS"
          grep -Eq 'minSdkVersion: Int = 24' "$FLUTTER_ANDROID_DEFAULTS"

          echo "Release metadata validated:"
          echo "  versionName: $VERSION_NAME"
          echo "  versionCode: $VERSION_CODE"
          echo "  applicationId: com.alejandrocruz.tuktukcontrol"
          echo "  visible name: TukTuk Conductor"
          echo "  compileSdk: 36"
          echo "  targetSdk: 36"
          echo "  minSdk: 24"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Analyze source
        run: flutter analyze --no-fatal-infos

      - name: Obtener gateway para las pruebas
        shell: bash
        run: |
          mkdir -p ../../vrixora-marketplace/supabase/functions/marketplace-customer-gateway
          curl -fLsS --retry 3 \
            https://raw.githubusercontent.com/alejandrodiscoveryy-ar/vrixora-admin-canvas/696285f68670fa96fb88f58236f1e15525cca014/supabase/functions/marketplace-customer-gateway/index.ts \
            -o ../../vrixora-marketplace/supabase/functions/marketplace-customer-gateway/index.ts

      - name: Run tests
        run: flutter test

      - name: Validate signing secrets
        shell: bash
        env:
          FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_GOOGLE_SERVICES_JSON"
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"

      - name: Restore temporary release signing files
        shell: bash
        env:
          FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON" > android/app/google-services.json
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          {
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'storeFile=../upload-keystore.jks\n'
          } > android/key.properties
          chmod 600 android/upload-keystore.jks android/key.properties

      - name: Verify merged Android manifest before full compilation
        env:
          RELEASE_VERSION_NAME: ${{ steps.metadata.outputs.version_name }}
          RELEASE_VERSION_CODE: ${{ steps.metadata.outputs.version_code }}
        run: |
          set -euo pipefail
          printf 'sdk.dir=%s\nflutter.sdk=%s\nflutter.versionName=%s\nflutter.versionCode=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" "$RELEASE_VERSION_NAME" "$RELEASE_VERSION_CODE" > android/local.properties
          cd android
          ./gradlew :app:verifyLegacyGraphicsManifest --no-daemon

      - name: Build signed release AAB
        run: >-
          flutter build appbundle --release
          --obfuscate
          --split-debug-info=build/symbols/android

      - name: Verify graphics compatibility in actual signed bundle
        shell: bash
        run: |
          set -euo pipefail
          JAR="$RUNNER_TEMP/bundletool-1.18.2.jar"
          curl -fLsS --retry 3 https://github.com/google/bundletool/releases/download/1.18.2/bundletool-all-1.18.2.jar -o "$JAR"
          echo "378b5434cd1378bef6b2bc527b8c7f0ff2584b273830335bce54d6d0813c8584  $JAR" | sha256sum -c -
          java -jar "$JAR" dump manifest --bundle=build/app/outputs/bundle/release/app-release.aab --module=base > "$RUNNER_TEMP/tuktuk-final-manifest.xml"
          python3 - "$RUNNER_TEMP/tuktuk-final-manifest.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          ns = '{http://schemas.android.com/apk/res/android}'
          root = ET.parse(sys.argv[1]).getroot()
          assert root.tag == 'manifest', 'Invalid bundle manifest'
          assert root.get('package') == 'com.alejandrocruz.tuktukcontrol', 'Wrong application package'
          versions = []
          for feature in root.findall('uses-feature'):
              version = feature.get(ns + 'glEsVersion')
              if version:
                  version = int(version, 0)
                  required = feature.get(ns + 'required', 'true') != 'false'
                  versions.append((version, required))
          print('Final OpenGL requirements:', [(hex(v), r) for v, r in versions])
          print('Final uses-feature declarations:', [ET.tostring(f, encoding='unicode').strip() for f in root.findall('uses-feature')])
          assert any(v == 0x20000 and r for v, r in versions), 'Missing GLES 2 base requirement'
          assert not any(v > 0x20000 and r for v, r in versions), 'Bundle still excludes GLES 2 devices'
          PY

      - name: Upload signed Google Play bundle
        uses: actions/upload-artifact@v4
        with:
          name: tuktuk-play-aab-${{ steps.metadata.outputs.version_name }}-build-${{ steps.metadata.outputs.version_code }}
          path: flutter_app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload protected debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: tuktuk-debug-symbols-${{ steps.metadata.outputs.version_name }}-build-${{ steps.metadata.outputs.version_code }}
          path: flutter_app/build/symbols/android
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary signing files
        if: always()
        shell: bash
        run: |
          rm -f android/app/google-services.json android/upload-keystore.jks android/key.properties
