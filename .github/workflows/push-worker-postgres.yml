name: Push worker integration

on:
  pull_request:
    paths:
      - ".github/workflows/push-worker-postgres.yml"
      - "flutter_app/supabase/functions/send-push-notifications/**"
      - "flutter_app/supabase/migrations/*harden_push_notification_worker.sql"
      - "flutter_app/supabase/tests/claim_push_notification_batch_integration.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: push-worker-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-concurrency:
    name: PostgreSQL 17 concurrent claims
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned PostgreSQL driver
        run: python -m pip install "psycopg[binary]==3.2.10"

      - name: Run real PostgreSQL concurrency tests
        run: python -m unittest -v flutter_app/supabase/tests/claim_push_notification_batch_integration.py

  deno-worker:
    name: Deno worker tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: flutter_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6

      - name: Check worker types
        run: deno check supabase/functions/send-push-notifications/index.ts

      - name: Run worker unit tests
        run: deno test supabase/functions/send-push-notifications/core_test.ts
