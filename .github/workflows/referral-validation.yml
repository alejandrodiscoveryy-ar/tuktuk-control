name: Referral validation
on:
  pull_request:
    paths:
      - 'flutter_app/lib/**'
      - 'flutter_app/test/**'
      - 'flutter_app/android/**'
      - 'flutter_app/supabase/tests/**'
      - 'flutter_app/supabase/functions/referral-redirect/**'
      - '.github/workflows/referral-validation.yml'
  workflow_dispatch:
    inputs:
      allow_apk_debug:
        description: 'Compilar APK debug solo con autorizacion expresa'
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - name: Obtener gateway para las pruebas
        run: |
          mkdir -p ../../vrixora-marketplace/supabase/functions/marketplace-customer-gateway
          curl -fLsS --retry 3 \
            https://raw.githubusercontent.com/alejandrodiscoveryy-ar/vrixora-admin-canvas/28c4cfefc2ae38cfe84575c7aacc113c401d073f/supabase/functions/marketplace-customer-gateway/index.ts \
            -o ../../vrixora-marketplace/supabase/functions/marketplace-customer-gateway/index.ts
      - run: flutter test --no-pub
      # Prohibido compilar APK automaticamente por cambios en un PR.
      # Solo se habilita en workflow_dispatch con el permiso booleano explicito.
      - name: Prepare fake Firebase configuration for compilation only
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_apk_debug == true }}
        run: cp test/fixtures/google-services.debug.json android/app/google-services.json
      - name: Compile debug only (no production signing or publication)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_apk_debug == true }}
        run: flutter build apk --debug --no-pub
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: referral_validation_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: flutter_app/supabase/tests
      - run: npm test
        working-directory: flutter_app/supabase/tests
      - run: node --test flutter_app/supabase/functions/referral-redirect/index.test.mjs
      - run: python -m pip install 'psycopg[binary]==3.2.10'
      - name: Existing destructive test against this job's disposable service only
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/referral_validation_disposable
        run: python flutter_app/supabase/tests/claim_push_notification_batch_integration.py
      - name: PR106 identity document SQL integration on isolated PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/referral_validation_disposable
        run: python flutter_app/supabase/tests/marketplace_identity_document_type_integration.py
