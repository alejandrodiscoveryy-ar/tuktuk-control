name: Referral validation
on:
  pull_request:
    paths:
      - 'flutter_app/lib/**'
      - 'flutter_app/test/**'
      - 'flutter_app/android/**'
      - 'flutter_app/supabase/tests/**'
      - 'flutter_app/supabase/functions/referral-redirect/**'
      - '.github/workflows/referral-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - name: Prepare fake Firebase configuration for compilation only
        run: cp test/fixtures/google-services.debug.json android/app/google-services.json
      - name: Compile debug only (no production signing or publication)
        run: flutter build apk --debug --no-pub
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: referral_validation_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: flutter_app/supabase/tests
      - run: npm test
        working-directory: flutter_app/supabase/tests
      - run: node --test flutter_app/supabase/functions/referral-redirect/index.test.mjs
      - run: python -m pip install 'psycopg[binary]==3.2.10'
      - name: Existing destructive test against this job's disposable service only
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/referral_validation_disposable
        run: python flutter_app/supabase/tests/claim_push_notification_batch_integration.py
