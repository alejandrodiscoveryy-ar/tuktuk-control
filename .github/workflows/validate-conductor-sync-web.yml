name: Check conductor sync fix and web build
on:
  pull_request:
    paths:
      - 'flutter_app/lib/data/record_store.dart'
      - 'flutter_app/lib/domain/sync.dart'
      - 'flutter_app/lib/domain/metrics.dart'
      - 'flutter_app/test/domain/sync_test.dart'
      - 'flutter_app/test/domain/metrics_test.dart'
      - 'flutter_app/lib/main.dart'
      - 'flutter_app/web/index.html'
      - 'flutter_app/lib/services/project_identity_runtime_web.dart'
      - 'flutter_app/lib/services/project_identity_runtime_stub.dart'
      - 'flutter_app/test/web_startup_single_screen_test.dart'
      - 'flutter_app/test/web_startup_icon.test.cjs'
      - 'flutter_app/tool/sync_project_branding.dart'
      - 'flutter_app/tool/project_icon_variant_loader.dart'
      - 'flutter_app/tool/project_icon_renderer.dart'
      - 'flutter_app/test/tool/project_icon_renderer_test.dart'
      - 'flutter_app/test/tool/project_icon_variant_loader_test.dart'
      - 'flutter_app/lib/data/marketplace_service.dart'
      - 'flutter_app/lib/presentation/marketplace_assigned_job_card.dart'
      - 'flutter_app/test/domain/marketplace_models_test.dart'
      - 'flutter_app/lib/presentation/marketplace_jobs.dart'
      - 'flutter_app/lib/data/marketplace_map_service.dart'
      - 'flutter_app/lib/presentation/marketplace_driver_map.dart'
      - 'flutter_app/test/domain/marketplace_map_visual_style_test.dart'
      - 'flutter_app/test/conductor_app_suspension_gate_contract_test.dart'
      - 'flutter_app/lib/presentation/screens.dart'
      - 'flutter_app/test/presentation/statistics_visual_layout_test.dart'
      - 'flutter_app/test/presentation/financial_overview_compact_test.dart'
      - 'flutter_app/lib/presentation/marketplace_shell.dart'
      - 'flutter_app/test/presentation/marketplace_more_layout_test.dart'
      - 'flutter_app/lib/presentation/widgets.dart'
      - 'flutter_app/test/presentation/marketplace_records_read_only_test.dart'
      - 'flutter_app/lib/services/push_notification_service.dart'
      - 'flutter_app/test/presentation/marketplace_jobs_refresh_test.dart'
      - 'flutter_app/test/presentation/marketplace_map_offer_price_pins_contract_test.dart'
      - 'flutter_app/test/services/push_notification_service_test.dart'
      - 'flutter_app/test/domain/marketplace_mixed_odometer_test.dart'
      - '.github/workflows/validate-conductor-sync-web.yml'
      - '.github/workflows/deploy-web-production.yml'
      - '.github/workflows/verify-web-auto-deploy-pr.yml'
      - '.github/ci/check-web-auto-deploy.mjs'
      - '.github/ci/web-branding-release.mjs'
      - '.github/ci/web-branding-release.test.mjs'
permissions:
  contents: read
jobs:
  check:
    name: Test and compile isolated web
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      - name: Install packages
        working-directory: flutter_app
        run: flutter pub get
      - name: Test release branding protections
        run: node --test .github/ci/web-branding-release.test.mjs
      - name: Prepare web branding
        working-directory: flutter_app
        env:
          TUKTUK_REQUIRE_FRESH_BRANDING: "1"
        run: dart run tool/sync_project_branding.dart --web
      - name: Validate and fingerprint generated branding
        run: |
          git restore --worktree -- flutter_app/android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java || true
          node .github/ci/web-branding-release.mjs prepare "$RUNNER_TEMP/web-branding.json"
      - name: Analyze
        working-directory: flutter_app
        run: flutter analyze --no-fatal-infos
      - name: Run sync and manual record regression tests
        working-directory: flutter_app
        run: |
          flutter test test/domain/marketplace_models_test.dart
          flutter test test/domain/marketplace_mixed_odometer_test.dart
          flutter test test/domain/sync_test.dart
          flutter test test/domain/metrics_test.dart
          flutter test test/presentation/statistics_visual_layout_test.dart test/presentation/financial_overview_compact_test.dart
          flutter test test/presentation/marketplace_records_read_only_test.dart
          flutter test test/presentation/marketplace_more_layout_test.dart
          flutter test test/presentation/marketplace_jobs_refresh_test.dart
          flutter test test/domain/marketplace_map_visual_style_test.dart
          flutter test test/presentation/marketplace_map_offer_price_pins_contract_test.dart
          flutter test test/services/push_notification_service_test.dart
          flutter test test/domain/web_oauth_redirect_test.dart
          flutter test test/conductor_app_suspension_gate_contract_test.dart
          flutter test test/web_startup_single_screen_test.dart
          flutter test test/tool/project_icon_variant_loader_test.dart
          flutter test test/tool/project_icon_renderer_test.dart
      - name: Test startup icon cache and refresh
        working-directory: flutter_app
        run: node --test test/web_startup_icon.test.cjs
      - name: Compile web, without publishing it
        working-directory: flutter_app
        run: flutter build web --release --base-href /tuktuk/app/ --no-tree-shake-icons
      - name: Verify compiled branding before review
        run: |
          git restore --worktree -- flutter_app/android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java || true
          node .github/ci/web-branding-release.mjs verify "$RUNNER_TEMP/web-branding.json"
          node - "$RUNNER_TEMP/web-branding.json" <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const expected = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          for (const [path, hash] of Object.entries(expected)) {
            const relative = path.replace(/^flutter_app\/web\//, '');
            const built = fs.readFileSync('flutter_app/build/web/' + relative);
            if (relative === 'index.html') {
              if (!built.toString('utf8').includes('src="icons/Icon-192.png?v=' + expected['flutter_app/web/icons/Icon-192.png'].slice(0, 16) + '"')) {
                throw new Error('Compiled startup icon version mismatch');
              }
            } else if (crypto.createHash('sha256').update(built).digest('hex') !== hash) {
              throw new Error('Compiled branding mismatch: ' + relative);
            }
          }
          console.log('COMPILED_BRANDING_INTEGRITY=OK');
          NODE
      - name: Preserve web build for review
        uses: actions/upload-artifact@v4
        with:
          name: tuktuk-sync-fix-web
          path: flutter_app/build/web
          retention-days: 5
