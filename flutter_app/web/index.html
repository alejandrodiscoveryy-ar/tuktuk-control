<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Control de ingresos, gastos, kilometraje y mantenimiento para propietarios y conductores de TukTuk.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#080D14">
  <meta name="apple-mobile-web-app-title" content="TukTuk Conductor">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-shortcut-192.png">
  <link rel="stylesheet" href="guided_camera.css">
  <title>TukTuk Conductor</title>
</head>
<body>
  <script>
    // Los avisos de carrera se habilitan solo con el estado de trabajo confirmado.
    // El navegador exige una interacciÃ³n del usuario para permitir sonido.
    (function () {
      'use strict';
      var jobAlertEnabled = false;
      var audioContext = null;
      var recentJobs = new Map();
      var jobIdPattern = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;

      function unlockSound() {
        try {
          var AudioContextType = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextType) return;
          audioContext = audioContext || new AudioContextType();
          if (audioContext.state === 'suspended') {
            audioContext.resume().catch(function () {});
          }
        } catch (_) {}
      }

      window.tuktukPrepareJobAlertFromGesture = function () {
        unlockSound();
        preloadJobSound();
        try {
          if ('Notification' in window && Notification.permission === 'default') {
            Promise.resolve(Notification.requestPermission()).catch(function () {});
          }
        } catch (_) {}
      };

      window.tuktukSetJobAlertEnabled = function (enabled) {
        jobAlertEnabled = enabled === true;
        if (jobAlertEnabled) preloadJobSound();
      };

      // TambiÃ©n desbloquea el audio si el conductor ya estaba trabajando al entrar.
      document.addEventListener('pointerdown', function () {
        if (jobAlertEnabled) unlockSound();
      }, {capture: true, passive: true});
      document.addEventListener('keydown', function () {
        if (jobAlertEnabled) unlockSound();
      }, {capture: true});

      var jobAudioBuffer = null;
      var jobAudioLoading = null;
      function preloadJobSound() {
        if (jobAudioBuffer || jobAudioLoading || !audioContext) return;
        jobAudioLoading = fetch('sounds/tuktuk_nueva_carrera.mp3')
          .then(function (response) {
            if (!response.ok) throw new Error('Sound unavailable');
            return response.arrayBuffer();
          })
          .then(function (bytes) { return audioContext.decodeAudioData(bytes); })
          .then(function (buffer) { jobAudioBuffer = buffer; })
          .catch(function () { jobAudioLoading = null; });
      }

      function soundForNewJob() {
        try {
          if (!audioContext || audioContext.state !== 'running') return;
          if (!jobAudioBuffer) { preloadJobSound(); return; }
          var source = audioContext.createBufferSource();
          source.buffer = jobAudioBuffer;
          source.connect(audioContext.destination);
          source.start();
        } catch (_) {}
      }

      function showOnScreen(body) {
        try {
          var banner = document.getElementById('tuktuk-new-job-alert');
          if (!banner) {
            banner = document.createElement('button');
            banner.id = 'tuktuk-new-job-alert';
            banner.type = 'button';
            banner.setAttribute('role', 'alert');
            banner.style.cssText = 'position:fixed;z-index:2147483640;top:95px;left:12px;right:12px;padding:14px 18px;border:2px solid #58E6B3;border-radius:16px;background:#102B36;color:white;font:700 16px system-ui;box-shadow:0 6px 26px #0009;text-align:left;';
            banner.onclick = function () { banner.remove(); window.focus(); };
            document.body.appendChild(banner);
          }
          banner.textContent = 'Nueva carrera disponible. ' + (body || 'Abre Trabajo para verla.');
          window.clearTimeout(banner._closeTimer);
          banner._closeTimer = window.setTimeout(function () { banner.remove(); }, 9000);
        } catch (_) {}
      }

      window.tuktukShowForegroundNotification = function (title, body, marketplaceJobId) {
        var job = jobIdPattern.test(marketplaceJobId || '');
        if (job && !jobAlertEnabled) return;
        if (job) {
          var now = Date.now();
          if (now - (recentJobs.get(marketplaceJobId) || 0) < 60000) return;
          recentJobs.set(marketplaceJobId, now);
          for (var entry of recentJobs) {
            if (now - entry[1] > 120000) recentJobs.delete(entry[0]);
          }
          soundForNewJob();
          showOnScreen(body);
          try { if (navigator.vibrate) navigator.vibrate([250, 100, 250]); } catch (_) {}
        }
        if (!('Notification' in window) || Notification.permission !== 'granted') return;
        try {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.ready.then(function (registration) {
              return registration.showNotification(title || 'TukTuk Conductor', {
                body: body || '', icon: 'icons/Icon-192.png',
                tag: job ? 'tuktuk-job-' + marketplaceJobId : undefined,
                renotify: job, requireInteraction: job,
                vibrate: job ? [250, 100, 250] : undefined,
                data: job ? {kind: 'marketplace_job_available', job_id: marketplaceJobId} : {}
              });
            }).catch(function () {});
          } else {
            new Notification(title || 'TukTuk Conductor', {body: body || ''});
          }
        } catch (_) {}
      };
    })();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('firebase-messaging-sw.js', {
          scope: './'
        }).catch(function () {
          // Push is optional; the WebApp must continue when unavailable.
        });
      });
    }
  </script>
  <script src="guided_camera.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
