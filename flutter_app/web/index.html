<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Control de ingresos, gastos, kilometraje y mantenimiento para propietarios y conductores de TukTuk.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#080D14">
  <meta name="apple-mobile-web-app-title" content="TukTuk Conductor">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-shortcut-192.png">
  <link rel="stylesheet" href="guided_camera.css?v=selfie3">
  <title>TukTuk Conductor</title>
  <style>
    /* Shell inmediato: evita la página blanca mientras descarga Flutter. */
    :root { color-scheme: dark; background: #080D14; }
    html, body { margin: 0; width: 100%; min-height: 100%; background: #080D14; }
    #tuktuk-web-startup {
      position: fixed; inset: 0; z-index: 2147483640;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 18px;
      background: #080D14; color: #F8FAFC;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      opacity: 1; transition: opacity .2s ease;
      padding: 24px; box-sizing: border-box; text-align: center;
    }
    #tuktuk-web-startup.is-ready { opacity: 0; pointer-events: none; }
    #tuktuk-web-startup img { width: min(42vw, 176px); height: auto; }
    #tuktuk-web-startup strong { font-size: 20px; letter-spacing: -.35px; }
    #tuktuk-web-startup [data-startup-note] {
      color: #A7B5C6; font-size: 13px; line-height: 1.45;
    }
    .tuktuk-web-spinner {
      width: 24px; height: 24px; border: 3px solid #254462;
      border-top-color: #2F80ED; border-radius: 50%;
      animation: tuktuk-spin .85s linear infinite;
    }
    @keyframes tuktuk-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      #tuktuk-web-startup { transition: none; }
      .tuktuk-web-spinner { animation: none; }
    }
  </style>
  <link rel="preload" href="flutter_bootstrap.js" as="script">
</head>
<body>
  <div id="tuktuk-web-startup" role="status" aria-live="polite">
    <img src="icons/Icon-192.png" width="176" height="176" alt="">
    <strong>TukTuk Conductor</strong>
    <span data-startup-note>Preparando tu jornada</span>
    <span class="tuktuk-web-spinner" aria-hidden="true"></span>
  </div>
  <script>
    (function () {
      var splash = document.getElementById('tuktuk-web-startup');
      var completed = false;
      window.tuktukFinishStartup = function () {
        if (completed || !splash) return;
        completed = true;
        // Esperar a que Flutter realmente pinte: evita un destello blanco
        // entre el evento del primer frame y la composición del navegador.
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            splash.classList.add('is-ready');
            setTimeout(function () { splash.remove(); }, 240);
          });
        });
      };
      setTimeout(function () {
        if (completed || !splash) return;
        var note = splash.querySelector('[data-startup-note]');
        if (note) note.textContent =
          'La conexión está tardando. TukTuk sigue iniciando.';
      }, 12000);
    })();
  </script>
  <script>
    // Los avisos de carrera se habilitan solo con el estado de trabajo confirmado.
    // El navegador exige una interacciÃ³n del usuario para permitir sonido.
    (function () {
      'use strict';
      var jobAlertEnabled = false;
      var audioContext = null;
      var recentJobs = new Map();
      var jobIdPattern = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;

      function unlockSound() {
        try {
          var AudioContextType = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextType) return;
          audioContext = audioContext || new AudioContextType();
          if (audioContext.state === 'suspended') {
            audioContext.resume().catch(function () {});
          }
        } catch (_) {}
      }

      window.tuktukPrepareJobAlertFromGesture = function () {
        unlockSound();
        preloadJobSound();
        try {
          if ('Notification' in window && Notification.permission === 'default') {
            Promise.resolve(Notification.requestPermission()).catch(function () {});
          }
        } catch (_) {}
      };

      window.tuktukSetJobAlertEnabled = function (enabled) {
        jobAlertEnabled = enabled === true;
        if (jobAlertEnabled) { unlockSound(); preloadJobSound(); }
      };

      // TambiÃ©n desbloquea el audio si el conductor ya estaba trabajando al entrar.
      document.addEventListener('pointerdown', function () {
        if (jobAlertEnabled) { unlockSound(); preloadJobSound(); }
      }, {capture: true, passive: true});
      document.addEventListener('keydown', function () {
        if (jobAlertEnabled) { unlockSound(); preloadJobSound(); }
      }, {capture: true});

      var jobAudioBuffer = null;
      var jobAudioLoading = null;
      function preloadJobSound() {
        if (jobAudioBuffer) return Promise.resolve(jobAudioBuffer);
        if (jobAudioLoading) return jobAudioLoading;
        if (!audioContext) return Promise.resolve(null);
        jobAudioLoading = fetch('sounds/tuktuk_nueva_carrera.mp3')
          .then(function (response) {
            if (!response.ok) throw new Error('Sound unavailable');
            return response.arrayBuffer();
          })
          .then(function (bytes) { return audioContext.decodeAudioData(bytes); })
          .then(function (buffer) { jobAudioBuffer = buffer; return buffer; })
          .catch(function () { jobAudioLoading = null; return null; });
        return jobAudioLoading;
      }

      function soundForNewJob() {
        try {
          if (!audioContext || audioContext.state !== 'running') return;
          if (!jobAudioBuffer) {
            preloadJobSound().then(function (buffer) {
              if (!buffer || !jobAlertEnabled || !audioContext || audioContext.state !== 'running') return;
              var lateSource = audioContext.createBufferSource();
              lateSource.buffer = buffer;
              lateSource.connect(audioContext.destination);
              lateSource.start();
            });
            return;
          }
          var source = audioContext.createBufferSource();
          source.buffer = jobAudioBuffer;
          source.connect(audioContext.destination);
          source.start();
        } catch (_) {}
      }

      // The preview only tests foreground multimedia audio. It does not
      // bypass Android silent mode or certify locked-screen notifications.
      window.tuktukPlayJobAlertSoundTest = function () {
        unlockSound();
        preloadJobSound().then(function (buffer) {
          try {
            if (!buffer || !audioContext || audioContext.state !== 'running') return;
            var source = audioContext.createBufferSource();
            source.buffer = buffer;
            source.connect(audioContext.destination);
            source.start();
          } catch (_) {}
        });
      };

      function showOnScreen(body) {
        try {
          var banner = document.getElementById('tuktuk-new-job-alert');
          if (!banner) {
            banner = document.createElement('button');
            banner.id = 'tuktuk-new-job-alert';
            banner.type = 'button';
            banner.setAttribute('role', 'alert');
            banner.style.cssText = 'position:fixed;z-index:2147483640;top:95px;left:12px;right:12px;padding:14px 18px;border:2px solid #58E6B3;border-radius:16px;background:#102B36;color:white;font:700 16px system-ui;box-shadow:0 6px 26px #0009;text-align:left;';
            banner.onclick = function () { banner.remove(); window.focus(); };
            document.body.appendChild(banner);
          }
          banner.textContent = 'Nueva carrera disponible. ' + (body || 'Abre Trabajo para verla.');
          window.clearTimeout(banner._closeTimer);
          banner._closeTimer = window.setTimeout(function () { banner.remove(); }, 9000);
        } catch (_) {}
      }

      window.tuktukShowForegroundNotification = function (title, body, marketplaceJobId) {
        var job = jobIdPattern.test(marketplaceJobId || '');
        if (job && !jobAlertEnabled) return;
        if (job) {
          var now = Date.now();
          if (now - (recentJobs.get(marketplaceJobId) || 0) < 60000) return;
          recentJobs.set(marketplaceJobId, now);
          for (var entry of recentJobs) {
            if (now - entry[1] > 120000) recentJobs.delete(entry[0]);
          }
          soundForNewJob();
          showOnScreen(body);
          try { if (navigator.vibrate) navigator.vibrate([250, 100, 250]); } catch (_) {}
        }
        if (!('Notification' in window) || Notification.permission !== 'granted') return;
        try {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.ready.then(function (registration) {
              return registration.showNotification(title || 'TukTuk Conductor', {
                body: body || '', icon: 'icons/Icon-192.png',
                tag: job ? 'tuktuk-job-' + marketplaceJobId : undefined,
                renotify: job, requireInteraction: job,
                vibrate: job ? [250, 100, 250] : undefined,
                data: job ? {kind: 'marketplace_job_available', job_id: marketplaceJobId} : {}
              });
            }).catch(function () {});
          } else {
            new Notification(title || 'TukTuk Conductor', {body: body || ''});
          }
        } catch (_) {}
      };
    })();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('firebase-messaging-sw.js', {
          scope: './'
        }).catch(function () {
          // Push is optional; the WebApp must continue when unavailable.
        });
      });
    }
  </script>
  <script src="guided_camera.js?v=selfie3"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
