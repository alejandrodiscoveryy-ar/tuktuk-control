<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Control de ingresos, gastos, kilometraje y mantenimiento para propietarios y conductores de TukTuk.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#080D14">
  <meta name="apple-mobile-web-app-title" content="TukTuk Control">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>TukTuk Control</title>
</head>
<body>
  <script>
    window.tuktukShowForegroundNotification = function (title, body) {
      try {
        if ('Notification' in window && Notification.permission === 'granted') {
          new Notification(title, {
            body: body,
            icon: 'icons/Icon-192.png'
          });
        }
      } catch (_) {
        // Foreground browser notifications are optional.
      }
    };

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('firebase-messaging-sw.js', {
          scope: './'
        }).catch(function () {
          // Push is optional; the WebApp must continue when unavailable.
        });
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
